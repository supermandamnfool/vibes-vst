name: Build plugin
on: [push, workflow_dispatch]

jobs:
  windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # ClangCL is required: the Beads DSP uses variable-length arrays, which MSVC rejects.
      - run: cmake -S . -B build -G "Visual Studio 17 2022" -T ClangCL -A x64 -DBEADS_BUILD_TESTS=OFF
      - run: cmake --build build --config Release --target Vibes_VST3
      - uses: actions/upload-artifact@v4
        with:
          name: Vibes-windows-vst3
          path: build/Vibes_artefacts/Release/VST3/Vibes.vst3

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DBEADS_BUILD_TESTS=OFF
      - run: cmake --build build --config Release --target Vibes_VST3 Vibes_AU
      - name: Sign (ad-hoc) and make one-click installer
        run: |
          VST3=build/Vibes_artefacts/Release/VST3/Vibes.vst3
          AU=build/Vibes_artefacts/Release/AU/Vibes.component
          codesign --force --deep -s - "$VST3"
          codesign --force --deep -s - "$AU"
          mkdir out
          pkgbuild --component "$VST3" --install-location /Library/Audio/Plug-Ins/VST3 --identifier com.vibes.vst3 --version 0.2.0 vst3.pkg
          pkgbuild --component "$AU" --install-location /Library/Audio/Plug-Ins/Components --identifier com.vibes.au --version 0.2.0 au.pkg
          productbuild --package vst3.pkg --package au.pkg out/Install-Vibes.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: Vibes-macos-installer
          path: out/Install-Vibes.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: Vibes-macos
          path: |
            build/Vibes_artefacts/Release/VST3/Vibes.vst3
            build/Vibes_artefacts/Release/AU/Vibes.component
