name: Build plugin
on: [push, workflow_dispatch]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # ClangCL is required: the Beads DSP uses variable-length arrays, which MSVC rejects.
      - run: cmake -S . -B build -G "Visual Studio 17 2022" -T ClangCL -A x64 -DBEADS_BUILD_TESTS=OFF
      - run: cmake --build build --config Release --target Vibes_VST3
      - uses: actions/upload-artifact@v4
        with:
          name: Vibes-windows-vst3
          path: build/Vibes_artefacts/Release/VST3/Vibes.vst3

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DBEADS_BUILD_TESTS=OFF
      - run: cmake --build build --config Release --target Vibes_VST3 Vibes_AU
      - uses: actions/upload-artifact@v4
        with:
          name: Vibes-macos
          path: |
            build/Vibes_artefacts/Release/VST3/Vibes.vst3
            build/Vibes_artefacts/Release/AU/Vibes.component
